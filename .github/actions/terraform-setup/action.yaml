name: Terraform setup
description: >
  Shared setup for Terraform plan/apply jobs across repos - AWS credentials
  and the Terraform CLI, plus optional SSH access to habit-tracker-iac for
  repos whose modules are git-sourced from it.

inputs:
  ssh-private-key:
    description: >
      Deploy key with read access to habit-tracker-iac. Leave empty for repos
      (like habit-tracker-iac itself) that don't source git modules from it.
    required: false
    default: ''
  aws-access-key-id:
    required: true
  aws-secret-access-key:
    required: true
  aws-region:
    required: true
  terraform-version:
    required: true

runs:
  using: composite
  steps:
    - name: Configure SSH access to habit-tracker-iac
      if: inputs.ssh-private-key != ''
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}

    - name: Trust github.com host key
      if: inputs.ssh-private-key != ''
      shell: bash
      run: mkdir -p ~/.ssh && ssh-keyscan -H github.com >> ~/.ssh/known_hosts

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}
