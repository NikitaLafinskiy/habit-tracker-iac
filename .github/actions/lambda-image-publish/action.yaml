name: Lambda image publish
description: >
  Builds the service's container image from a native bootstrap binary produced
  earlier in the run (native-image-build, handed over as an artifact) and
  pushes it to ECR as :current and :<commit sha>.

  The function never reads :current directly: the lambda module resolves the
  tag to a digest and pins image_uri to it, so every push here is a Terraform
  diff, exactly as the S3 object version was for the zip.

  Callers must check out the repo (for the Dockerfile), download the bootstrap
  artifact into build/native/nativeCompile, and configure AWS credentials
  before this step.

inputs:
  repository:
    description: ECR repository name, e.g. habit-tracker-api-dev.
    required: true

runs:
  using: composite
  steps:
    - name: Log in to ECR
      id: ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and push
      shell: bash
      env:
        IMAGE: ${{ steps.ecr.outputs.registry }}/${{ inputs.repository }}
      run: |
        chmod +x build/native/nativeCompile/bootstrap
        docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:current" .
        docker push "$IMAGE:${{ github.sha }}"
        docker push "$IMAGE:current"
