name: Prod plan
run-name: ${{ github.ref_name }}-${{ github.actor }}

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  terraform:
    uses: ./.github/workflows/terraform-plan.yaml
    with:
      environment: prod
    secrets:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
