name: Prod plan
run-name: ${{ github.ref_name }}-${{ github.actor }}

# Review path for prod. Plan only - applying is a separate, manually
# dispatched workflow (iac-prod-apply.yaml).
on:
  pull_request:
    branches: [main]

jobs:
  terraform:
    uses: ./.github/workflows/terraform-plan.yaml
    with:
      environment: prod
    secrets:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
