name: Terraform plan/apply
run-name: ${{ github.ref_name }}-${{ github.actor }}

# Triggers directly on this repo's own PRs/pushes/dispatches (self plan/apply
# of main.tf) *and* stays callable by other repos (auth/api/client's own
# terraform.yaml `uses: NikitaLafinskiy/habit-tracker-iac/.github/workflows/
# terraform-plan-apply.yaml@main`) - one file instead of a separate trigger
# wrapper, since workflow_call can coexist with other trigger types in the
# same `on:` block. Every `inputs.*`/custom-named `secrets.*` reference
# below falls back to a same-repo default, since that context is only
# populated when actually invoked via workflow_call (or workflow_dispatch
# with matching declared inputs) - a plain pull_request run of this file
# has neither.
#
# Which environment a run targets is derived from the ref, never passed in:
# the dev branch is the dev environment and everything else is prod. That
# picks the backend key (backend.<env>.hcl), the var file
# (terraform.<env>.tfvars) and the GitHub environment the vars come from, so
# the three cannot be paired wrongly - see doc/CLAUDE.md "Environments".
on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]
  workflow_dispatch:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the Terraform root to plan/apply
        type: string
        required: false
        default: '.'
      terraform-version:
        type: string
        required: false
        default: '1.9.8'
      needs-iac-ssh-access:
        description: >
          Whether this repo's Terraform sources modules via git::ssh from
          habit-tracker-iac (requires the iac-modules-deploy-key secret)
        type: boolean
        required: false
        default: false
    secrets:
      aws-access-key-id:
        required: true
      aws-secret-access-key:
        required: true
      iac-modules-deploy-key:
        required: false

# One in-flight run per root per environment. Two pushes to dev in quick
# succession would otherwise race for the state lock and one would fail on a
# lock it can never acquire, rather than simply queueing.
concurrency:
  group: terraform-${{ github.repository }}-${{ inputs.working-directory || '.' }}-${{ github.ref == 'refs/heads/dev' && 'dev' || 'prod' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-22.04
    environment: ${{ github.ref == 'refs/heads/dev' && 'dev' || 'prod' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    env:
      TF_STATE_S3_BUCKET: ${{ vars.TF_STATE_S3_BUCKET }}
      TF_VAR_tf_state_s3_bucket: ${{ vars.TF_STATE_S3_BUCKET }}
      TF_ENV: ${{ github.ref == 'refs/heads/dev' && 'dev' || 'prod' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Terraform setup
        uses: NikitaLafinskiy/habit-tracker-iac/.github/actions/terraform-setup@main
        with:
          ssh-private-key: ${{ inputs.needs-iac-ssh-access && secrets.iac-modules-deploy-key || '' }}
          # secrets.aws-access-key-id only exists when a caller passed it
          # through workflow_call's own secrets: block - on a direct
          # self-trigger it's empty, so this falls back to this repo's own
          # AWS_ACCESS_KEY_ID secret (what infra.yaml used to pass in
          # explicitly).
          aws-access-key-id: ${{ secrets.aws-access-key-id || secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.aws-secret-access-key || secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          terraform-version: ${{ inputs.terraform-version || '1.9.8' }}

      - name: Terraform Init
        run: terraform init -reconfigure -backend-config="backend.${TF_ENV}.hcl"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -var-file="terraform.${TF_ENV}.tfvars" -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.ref == 'refs/heads/dev' && 'dev' || 'prod' }}
          path: ${{ inputs.working-directory || '.' }}/tfplan
          # A prod apply waits on a human manually dispatching this workflow,
          # which can easily span a weekend - keep the plan around long enough
          # to survive that wait.
          retention-days: 5

  apply:
    needs: plan
    runs-on: ubuntu-22.04
    environment: ${{ github.ref == 'refs/heads/dev' && 'dev' || 'prod' }}
    # Prod is unchanged: this repo is private on a plan without
    # required-reviewer environment protection, so `environment:` alone
    # doesn't hold an apply for approval - it would just run straight through
    # after plan. Gating on an explicit workflow_dispatch is the manual
    # approval: prod applies only when a human opens this workflow on main and
    # clicks "Run workflow", never off the back of a push or PR.
    # github.event_name reflects the original triggering event even across a
    # workflow_call boundary, so this gate works identically for a remote
    # caller's own workflow_dispatch too.
    #
    # Dev is deliberately not gated that way: a push to the dev branch applies,
    # which is the whole point of having a throwaway environment.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    env:
      TF_STATE_S3_BUCKET: ${{ vars.TF_STATE_S3_BUCKET }}
      TF_VAR_tf_state_s3_bucket: ${{ vars.TF_STATE_S3_BUCKET }}
      TF_ENV: ${{ github.ref == 'refs/heads/dev' && 'dev' || 'prod' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Terraform setup
        uses: NikitaLafinskiy/habit-tracker-iac/.github/actions/terraform-setup@main
        with:
          ssh-private-key: ${{ inputs.needs-iac-ssh-access && secrets.iac-modules-deploy-key || '' }}
          aws-access-key-id: ${{ secrets.aws-access-key-id || secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.aws-secret-access-key || secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          terraform-version: ${{ inputs.terraform-version || '1.9.8' }}

      - name: Terraform Init
        run: terraform init -reconfigure -backend-config="backend.${TF_ENV}.hcl"

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.ref == 'refs/heads/dev' && 'dev' || 'prod' }}
          path: ${{ inputs.working-directory || '.' }}

      - name: Terraform Apply
        run: terraform apply -input=false tfplan
